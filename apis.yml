name: Ecovate
description: Ecovate (Ecovate Energy Indices) is an Israeli energy-data company that
  operates a platform for the wholesale electricity market price index. It publishes
  benchmark indices and analytics tracking wholesale electricity market prices, giving
  energy suppliers, large consumers, traders, and regulators a transparent reference
  for the cost of electricity in the wholesale market. Ecovate was surfaced as a
  portfolio company of Battery Ventures and added to the API Evangelist network. The
  company's public presence is a marketing/product site (Hebrew and English editions)
  and it does not currently publish a developer program, public API, OpenAPI, SDKs,
  or documentation surface, so this profile carries identity and domain-security
  signals only.
